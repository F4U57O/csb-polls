<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8" />
    <title>Sign In</title>
  </head>
  <body>
    <h1>Sign in to Polls</h1>
    {% if request.GET.next %}
    <p style="color: red; font-weight: bold">You need to sign in to vote</p>
    {% endif %} {% if form.errors %}
    <p style="color: red">Username or password is wrong</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Log In</button>
    </form>
  </body>
</html>
